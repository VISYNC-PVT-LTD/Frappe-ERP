
name: Build and Publish VISYNC ERP Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - apps.json
      - images/**
      - .github/workflows/build-hrms-image.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/visync-pvt-ltd/frappe-erp

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ERPNext + HRMS
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./images/layered/Containerfile
          push: true

          tags: |
            ghcr.io/visync-pvt-ltd/frappe-erp:v16.60.0-hrms
            ghcr.io/visync-pvt-ltd/frappe-erp:${{ github.sha }}

          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}

          secret-files: |
            apps_json=./apps.json
